name: anki-sync-server

services:
  anki-sync-server:
    image: ${ANKI_IMAGE:-ghcr.io/kingdaniel4747/anki-sync-server:latest}
    ports:
      - "${SYNC_BIND_IP:-127.0.0.1}:${SYNC_HTTP_PORT:-8080}:8080"
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:${DASHBOARD_HTTP_PORT:-8081}:8081"
    environment:
      DASHBOARD_AUTH: "${DASHBOARD_AUTH:-}"
      DASHBOARD_COOKIE_SECURE: "${DASHBOARD_COOKIE_SECURE:-false}"
      TZ: "${TZ:-UTC}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - type: bind
        source: "${DATA_DIR:-./data}"
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: "${BACKUP_DIR:-./backups}"
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: "${CONFIG_DIR:-./config}"
        target: /config
        bind:
          create_host_path: false
