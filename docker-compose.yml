services:
  anki-sync-server:
    image: ghcr.io/kingdaniel4747/anki-sync-server:latest
    ports:
      - "8082:8080"
      - "8083:8081"
    environment:
      DASHBOARD_AUTH: "${DASHBOARD_AUTH:-}"
      TZ: "${TZ:-UTC}"
    volumes:
      - "./data/anki:/data"
      - "./data/config:/config"
      - "/mnt/storage/anki:/backups"
