name: anki-sync-server

services:
  anki-sync-server:
    image: ${ANKI_IMAGE:-anki-sync-server:local}
    build: .
    container_name: anki-sync-server
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${SYNC_BIND_IP:-0.0.0.0}:${SYNC_HTTP_PORT:-8080}:8080"
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:${DASHBOARD_HTTP_PORT:-8081}:8081"
    environment:
      DASHBOARD_COOKIE_SECURE: "${DASHBOARD_COOKIE_SECURE:-false}"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      TLS_DOMAIN: "${TLS_DOMAIN:-}"
      DASHBOARD_TLS_DOMAIN: "${DASHBOARD_TLS_DOMAIN:-}"
      TLS_EMAIL: "${TLS_EMAIL:-}"
    volumes:
      - anki_data:/data
      - anki_backups:/backups
      - anki_config:/config

volumes:
  anki_data:
  anki_backups:
  anki_config:
