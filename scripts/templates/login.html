{% extends "layout.html" %}
{% block title %}Sign in{% endblock %}
{% block main_class %}signin{% endblock %}
{% block content %}
<p class="muted">Anki Sync Server · Administration</p>
<section>
    <h1>Sign in</h1>
    {% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <label>Administrator name <input name="username" autocomplete="username" maxlength="256" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
        <button type="submit">Sign in</button>
    </form>
</section>
{% endblock %}
